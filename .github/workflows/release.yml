name: Windows ARM64 artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        platform:
          # - os: windows-latest
          #   rust_target: x86_64-pc-windows-msvc
          # - os: macos-latest
          #   rust_target: aarch64-apple-darwin
          # - os: macos-15-intel
          #   rust_target: x86_64-apple-darwin
          # - os: ubuntu-latest
          #   rust_target: x86_64-unknown-linux-gnu
          - os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.platform.os }}
    env:
      CC_aarch64_pc_windows_msvc: clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - name: Build unsigned Windows ARM64 app and installers
        shell: pwsh
        run: |
          $testConfig = Join-Path $env:RUNNER_TEMP 'tauri-arm64-test.json'
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8 $testConfig
          npm run tauri build -- --target ${{ matrix.platform.rust_target }} --bundles msi,nsis --config $testConfig
      - name: Upload Windows ARM64 app and installers
        uses: actions/upload-artifact@v4
        with:
          name: Zuno-Windows-ARM64
          if-no-files-found: error
          path: |
            src-tauri/target/aarch64-pc-windows-msvc/release/zuno.exe
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
